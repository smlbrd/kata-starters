name: JavaScript

on:
  push:
    paths:
      - "javascript/**"
      - ".github/workflows/javascript.yml"
  pull_request:
    paths:
      - "javascript/**"
      - ".github/workflows/javascript.yml"
  workflow_dispatch: {}

defaults:
  run:
    working-directory: javascript

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm test
